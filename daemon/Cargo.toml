[package]
name = "duet"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
# whisper.cpp Vulkan backend. Requires `vulkan-headers` to build.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webrtc-vad = "0.4.0"
whisper-rs = "0.16.0"
